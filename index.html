<html lang="fr" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accords et Négociations Nokia</title>
    <style>
        :root {
            --bg: #0f1115;
            --surface: #1a1d24;
            --surface-2: #22262f;
            --border: #2e333d;
            --text: #e8eaed;
            --text-muted: #9aa0aa;
            --accent: #e63946;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: var(--text);
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: var(--text-muted);
        }

        .agreement-toolbar {
            display: flex;
            gap: 12px;
            margin: 0 0 22px;
        }

        .agreement-toolbar input,
        .agreement-toolbar select {
            min-height: 42px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            padding: 8px 12px;
        }

        .agreement-toolbar input {
            flex: 1;
            min-width: 0;
        }

        .agreement-toolbar input:focus,
        .agreement-toolbar select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .agreement-count {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .agreement-list {
            border-top: 1px solid var(--border);
        }

        .agreement-entry {
            align-items: start;
            border-bottom: 1px solid var(--border);
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            min-width: 0;
            padding: 17px 12px;
        }

        .agreement-main {
            min-width: 0;
        }

        .agreement-heading {
            display: grid;
            gap: 5px;

        .agreement-link.agreement-meta-link {
            color: #4da3ff;
        }
        }

        .agreement-title {
            font-size: 1em;
            line-height: 1.4;
        }

        .agreement-title-line {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
        }

        .agreement-content {
            color: var(--text-muted);
            font-size: 0.84em;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .agreement-tract-line {
            margin-top: 4px;
        }

        .agreement-meta {
            color: var(--text-muted);
            font-size: 0.78em;
        }

        .agreement-meta-line {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .agreement-meta-link {
            font-size: 0.78em;
            white-space: nowrap;
        }

        .agreement-document-list {
            display: grid;
            gap: 4px;
            margin: 0;
            min-width: 0;
            padding-left: 18px;
        }

        .agreement-document-list li {
            overflow-wrap: anywhere;
        }

        .agreement-status {
            align-items: center;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            font-size: 0.78em;
            gap: 6px 12px;
            grid-column: 2;
            justify-content: flex-start;
            align-items: center;
        }

        .agreement-validity {
            align-items: center;
            border: 1px solid currentColor;
            border-radius: 4px;
            box-sizing: border-box;
            display: inline-flex;
            font-weight: 700;
            height: 28px;
            line-height: 1.2;
            padding: 0 8px;
            white-space: nowrap;
        }

        .agreement-validity.valid {
            color: #50d69b;
        }

        .agreement-validity.invalid {
            color: #ff5964;
        }

        .agreement-validity.pending {
            color: #e6b94f;
            font-size: 0.72em;
            font-weight: 600;
        }

        .agreement-os-status {
            align-items: center;
            box-sizing: border-box;
            display: inline-flex;
            height: 28px;
            white-space: nowrap;
        }

        .agreement-os-status strong {
            color: var(--text);
            font-weight: 600;
        }

        .cgt-logo {
            height: 30px;
            object-fit: cover;
            object-position: left center;
            vertical-align: middle;
            width: 30px;
        }

        .agreement-link {
            color: #ff737d;
            display: inline-block;
            font-weight: 600;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        .agreement-empty {
            color: var(--text-muted);
            padding: 24px 12px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .agreement-toolbar {
                flex-direction: column;
            }

            .agreement-entry {
                grid-template-columns: minmax(0, 1fr);
            }

            .agreement-status {
                grid-column: 1;
                justify-content: flex-start;
            }
        }
    </style>

        agreementRows.forEach(agreement => {
            agreement.documentTarget = getAgreementUrls(agreement);
        });

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function renderAgreementList() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="agreement-toolbar">
                    <input id="agreement-search" type="search" placeholder="Rechercher un accord" aria-label="Rechercher un accord">
                    <select id="agreement-filter" aria-label="Filtrer les accords">
                        <option value="">Tous les accords</option>
                        <optgroup label="Année"></optgroup>
                        <optgroup label="Thème">
                            <option value="theme:salaires">Salaires</option>
                            <option value="theme:effectifs">Effectifs</option>
                        </optgroup>
                    </select>
                </div>
                <p class="agreement-count" id="agreement-count" aria-live="polite"></p>
                <div class="agreement-list" id="agreement-list"></div>
            `;

            const search = document.getElementById('agreement-search');
            const agreementFilter = document.getElementById('agreement-filter');
            const list = document.getElementById('agreement-list');
            const count = document.getElementById('agreement-count');
            const yearOptions = [...new Set(agreementRows.map(agreement => agreement.year))]
                .sort((first, second) => first.localeCompare(second))
                .map(year => `<option value="year:${escapeHtml(year)}">${escapeHtml(year)}</option>`)
                .join('');
            agreementFilter.querySelector('optgroup[label="Année"]').innerHTML = yearOptions;

            function updateList() {
                const query = search.value.trim().toLocaleLowerCase('fr');
                const [filterType, filterValue] = agreementFilter.value.split(':');
                const filtered = agreementRows.filter(agreement => {
                    const matchesFilter = !agreementFilter.value ||
                        (filterType === 'year' && agreement.year === filterValue) ||
                        (filterType === 'theme' && filterValue === 'effectifs' && /RCC/i.test(agreement.title)) ||
                        (filterType === 'theme' && filterValue === 'salaires' && /NAO|intéressement/i.test(agreement.title));
                    const tractSearchText = getTracts(agreement)
                        .flatMap(tract => [tract.title, tract.url])
                        .filter(Boolean)
                        .join(' ');
                    const searchableValues = Object.entries(agreement)
                        .filter(([key]) => key !== 'tract' && key !== 'tractTarget')
                        .flatMap(([, value]) => Array.isArray(value) ? value : [value]);
                    const matchesQuery = !query || `${searchableValues.join(' ')} ${tractSearchText}`
                        .toLocaleLowerCase('fr').includes(query);
                    return matchesFilter && matchesQuery;
                });

                count.textContent = `${filtered.length} accord${filtered.length === 1 ? '' : 's'}`;
                list.innerHTML = filtered.length ? filtered.map(agreement => {
                    const organizationKeys = ['cgt', 'cfdt', 'cfeCgc'];
                    const hasUnverifiedStatus = organizationKeys.some(organization =>
                        String(agreement[organization]).trim().toLocaleLowerCase('fr').startsWith('à vérifier')
                    );
                    const signatureCount = organizationKeys
                        .filter(organization => String(agreement[organization]).trim() === '✅')
                        .length;
                    const validityStatus = hasUnverifiedStatus ? 'À vérifier' : agreement.validity;
                    const isValid = validityStatus === '✅';
                    const isPending = validityStatus !== '✅' && validityStatus !== '❌';
                    const validityLabel = isPending
                        ? 'Accord à vérifier : au moins un statut OS est à vérifier'
                        : isValid
                            ? `Accord valide : ${signatureCount} signatures confirmées`
                            : `Accord non valide : ${signatureCount} signatures confirmées sur 3`;
                    const validityClass = isPending ? 'pending' : isValid ? 'valid' : 'invalid';
                    const validityText = isPending ? 'À vérifier' : isValid ? 'Valide' : 'Invalide';
                    const signatureSource = agreement.signatureSource || 'Source de signature non renseignée';
                    const validityTitle = `${validityLabel}. Source : ${signatureSource}`;
                    const organizationStatuses = [
                        ['CGT', agreement.cgt],
                        ['CFDT', agreement.cfdt],
                        ['CFE-CGC', agreement.cfeCgc]
                    ].map(([organization, status]) => {
                        const organizationLabel = organization === 'CGT'
                            ? `<img class="cgt-logo" src="${CGT_LOGO_URL}" alt="CGT">`
                            : `<strong>${organization}</strong>`;
                        return `
                            <span class="agreement-os-status" title="${escapeHtml(signatureSource)}">${organizationLabel} ${escapeHtml(status || 'À vérifier')}</span>
                        `;
                    }).join('');
                    const documentUrls = getAgreementUrls(agreement);
                    const documentMetaLinks = documentUrls.map(url => {
                        const label = documentUrls.length > 1 ? getDocumentName(url) : 'Ouvrir sur le SharePoint';
                        return `<a class="agreement-link agreement-meta-link" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
                    });
                    const documentMetaLink = documentUrls.length > 1
                        ? `<ul class="agreement-document-list">${documentMetaLinks.map(link => `<li>${link}</li>`).join('')}</ul>`
                        : documentMetaLinks.join('');
                    const tractLinks = getTracts(agreement).map(tract => {
                        const title = escapeHtml(tract.title || 'Ouvrir le tract');
                        const link = tract.url
                            ? `<a class="agreement-link agreement-tract-link" href="${escapeHtml(tract.url)}" target="_blank" rel="noopener noreferrer" title="Ouvrir le tract : ${title}">${title} ↗</a>`
                            : title;
                        return `<div class="agreement-tract-line agreement-content">Relire notre tract : ${link}</div>`;
                    }).join('');

                    return `
                        <div class="agreement-entry">
                            <div class="agreement-main">
                                <div class="agreement-heading">
                                    <div class="agreement-title-line">
                                        <span class="agreement-title">${escapeHtml(agreement.title)}</span>
                                        <span class="agreement-validity ${validityClass}" title="${escapeHtml(validityTitle)}" aria-label="${escapeHtml(validityLabel)}">${validityText}</span>
                                    </div>
                                    <div class="agreement-meta-line">
                                        <span class="agreement-meta">${agreement.year} · ${escapeHtml(agreement.site)}</span>
                                        ${documentMetaLink}
                                    </div>
                                    <span class="agreement-content">${escapeHtml(agreement.content || '—')}</span>
                                    ${tractLinks}
                                </div>
                            </div>
                            <div class="agreement-status">${organizationStatuses}</div>
                        </div>
                    `;
                }).join('') : '<p class="agreement-empty">Aucun accord ne correspond à la recherche.</p>';
            }

            search.addEventListener('input', updateList);
            agreementFilter.addEventListener('change', updateList);
            updateList();
        }

        renderAgreementList();
    </script>
