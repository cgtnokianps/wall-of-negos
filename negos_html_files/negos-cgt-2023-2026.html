<html lang="fr" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accords et Négociations Nokia</title>
    <style>
        :root {
            --bg: #0f1115;
            --surface: #1a1d24;
            --surface-2: #22262f;
            --border: #2e333d;
            --text: #e8eaed;
            --text-muted: #9aa0aa;
            --accent: #e63946;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            align-items: start;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            text-align: center;
            margin-bottom: 40px;
            color: var(--text);
        }

        .header-logo {
            grid-column: 1;
            height: auto;
            justify-self: start;
            width: 138px;
        }

        .header-title {
            grid-column: 2;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            color: var(--text-muted);
        }

        .header-chart {
            color: var(--text-muted);
            font-size: 0.936em;
            margin: 22px auto 0;
            max-width: 40em;
            text-align: center;
        }

        .header-chart-pie {
            aspect-ratio: 1;
            border-radius: 50%;
            margin: 0 auto 10px;
            width: 120px;
        }

        .header-chart-legend {
            display: grid;
            gap: 2px;
            justify-items: start;
            list-style: none;
            margin: 0 auto;
            white-space: normal;
            width: max-content;
        }

        .header-chart-summary {
            color: var(--text);
            line-height: 1.45;
            margin: 12px auto 0;
            max-width: 38em;
        }

        .header-chart-summary strong {
            font-weight: 700;
        }

        .header-chart-legend span {
            border-radius: 2px;
            display: inline-block;
            height: 10px;
            margin-right: 5px;
            width: 10px;
        }

        .agreement-toolbar {
            display: flex;
            gap: 12px;
            margin: 0 0 22px;
        }

        .agreement-toolbar input,
        .agreement-toolbar select {
            min-height: 42px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            padding: 8px 12px;
        }

        .agreement-toolbar input {
            flex: 1;
            min-width: 0;
        }

        .agreement-toolbar input:focus,
        .agreement-toolbar select:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .agreement-count {
            color: var(--text-muted);
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .agreement-list {
            border-top: 1px solid var(--border);
        }

        .agreement-entry {
            align-items: start;
            border-bottom: 1px solid var(--border);
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
            min-width: 0;
            padding: 17px 12px;
        }

        .agreement-main {
            min-width: 0;
        }

        .agreement-heading {
            display: grid;
            gap: 5px;

        .agreement-link.agreement-meta-link {
            color: #4da3ff;
        }
        }

        .agreement-title {
            font-size: 1em;
            line-height: 1.4;
        }

        .agreement-title-line {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-width: 0;
        }

        .agreement-content {
            color: var(--text-muted);
            font-size: 0.84em;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .agreement-cgt-position strong {
            color: #e63946;
            font-weight: 600;
        }

        .agreement-tract-line {
            margin-top: 4px;
        }

        .agreement-meta {
            color: var(--text-muted);
            font-size: 0.78em;
        }

        .agreement-meta-line {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .agreement-meta-link {
            font-size: 0.78em;
            white-space: nowrap;
        }

        .agreement-document-list {
            display: grid;
            gap: 4px;
            margin: 0;
            min-width: 0;
            padding-left: 18px;
        }

        .agreement-document-list li {
            overflow-wrap: anywhere;
        }

        .agreement-status {
            align-items: center;
            color: var(--text-muted);
            display: grid;
            font-size: 0.78em;
            gap: 6px 12px;
            grid-column: 2;
            grid-template-columns: repeat(4, 118px);
            justify-content: start;
        }

        .agreement-validity {
            align-items: center;
            border: 1px solid currentColor;
            border-radius: 4px;
            box-sizing: border-box;
            display: inline-flex;
            font-weight: 700;
            height: 28px;
            line-height: 1.2;
            padding: 0 8px;
            white-space: nowrap;
        }

        .agreement-validity.valid {
            color: #50d69b;
        }

        .agreement-validity.invalid {
            color: #ff5964;
        }

        .agreement-validity.pending {
            color: #e6b94f;
            font-size: 0.72em;
            font-weight: 600;
        }

        .agreement-os-status {
            align-items: center;
            box-sizing: border-box;
            display: inline-flex;
            gap: 4px;
            white-space: nowrap;
        }

        .agreement-mark {
            font-size: 2em;
            line-height: 1;
        }

        .agreement-os-status[data-union="cgt"] { color: #e63946; }
        .agreement-os-status[data-union="cfdt"] { color: #f4a261; }
        .agreement-os-status[data-union="cfe"] { color: #4da3ff; }
        .agreement-os-status[data-union="cftc"] { color: #9aa0aa; }

        .agreement-os-status strong {
            color: inherit;
            font-size: 1.5em;
            font-weight: 600;
        }

        .agreement-link {
            color: #ff737d;
            display: inline-block;
            font-weight: 600;
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        .agreement-empty {
            color: var(--text-muted);
            padding: 24px 12px;
        }

        @media (max-width: 768px) {
            .header {
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
            }

            .header-logo {
                grid-column: 1;
                width: 108px;
            }

            .header-title {
                grid-column: 1;
            }

            .header-chart {
                margin-top: 16px;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .agreement-toolbar {
                flex-direction: column;
            }

            .agreement-entry {
                grid-template-columns: minmax(0, 1fr);
            }

            .agreement-status {
                grid-column: 1;
                justify-content: flex-start;
            }
        }
    </style>

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
        }

        function renderAgreementList() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="agreement-toolbar">
                    <input id="agreement-search" type="search" placeholder="Rechercher un accord" aria-label="Rechercher un accord">
                    <select id="theme-filter" aria-label="Thème">
                        <option value="">Tous les thèmes</option>
                        <option value="salaires">Salaires</option>
                        <option value="effectifs">Effectifs</option>
                    </select>
                    <select id="site-filter" aria-label="Périmètre">
                        <option value="NNF">NNF</option>
                        <option value="NPS">NPS</option>
                        <option value="LAN">LAN</option>
                    </select>
                    <select id="year-filter" aria-label="Année"></select>
                </div>
                <p class="agreement-count" id="agreement-count" aria-live="polite"></p>
                <div class="agreement-list" id="agreement-list"></div>
            `;

            const search = document.getElementById('agreement-search');
            const siteFilter = document.getElementById('site-filter');
            const themeFilter = document.getElementById('theme-filter');
            const yearFilter = document.getElementById('year-filter');
            const representativityChart = document.getElementById('representativity-chart');
            const representativity = {
                NNF: [['CFDT', 48.60], ['CFE-CGC', 27.91], ['CGT', 23.49]],
                NPS: [['CFDT', 42.17], ['CFE-CGC', 28.09], ['CGT', 18.20], ['CFTC', 11.54]],
                LAN: [['CFDT', 51.39], ['CGT', 32.18], ['CFE-CGC', 16.44]]
            };
            const unionColors = { CGT: '#e63946', CFDT: '#f4a261', 'CFE-CGC': '#4da3ff', CFTC: '#9aa0aa' };
            const representativitySummary = {
                NNF: "Aucune organisation syndicale n'est majoritaire. Il faut la signature d'au moins 2 des 3 syndicats représentatifs pour valider un accord.",
                NPS: "La CFDT et la CFTC disposent ensemble de la majorité et peuvent valider seules un accord d'établissement.",
                LAN: "La CFDT est majoritaire à elle seule et peut valider seule un accord d'établissement."
            };
            const representativityTitle = {
                NNF: 'Représentativité entreprise NNF',
                NPS: 'Représentativité établissement NPS',
                LAN: 'Représentativité établissement LAN'
            };

            function renderRepresentativity(site) {
                if (!site || !representativity[site]) {
                    representativityChart.hidden = true;
                    representativityChart.innerHTML = '';
                    return;
                }
                representativityChart.hidden = false;
                const results = representativity[site];
                const total = results.reduce((sum, [, percent]) => sum + percent, 0);
                let angle = 0;
                const slices = results.map(([union, percent]) => {
                    const start = angle;
                    angle += percent / total * 360;
                    return `${unionColors[union]} ${start}deg ${angle}deg`;
                }).join(', ');
                const format = percent => percent.toLocaleString('fr-FR', { minimumFractionDigits: 2 });
                const label = ([union, percent]) => {
                    const note = site === 'NNF' && union === 'CFTC' ? ' (< 10 %, non représentatif)' : '';
                    return `${union} ${format(percent)} %${note}`;
                };
                const summary = representativitySummary[site] || '';
                const title = representativityTitle[site] || `Représentativité ${site}`;
                representativityChart.innerHTML = `
                    <div class="header-chart-pie" role="img" aria-label="${escapeHtml(title)} : ${results.map(label).join(', ')}. ${escapeHtml(summary)}" style="background: conic-gradient(${slices})"></div>
                    <ul class="header-chart-legend">
                        ${results.map(result => {
                            const [union] = result;
                            return `<li><span style="background: ${unionColors[union]}"></span>${escapeHtml(label(result))}</li>`;
                        }).join('')}
                    </ul>
                    <figcaption class="header-chart-summary"><strong>${escapeHtml(title)}</strong> : ${escapeHtml(summary)}</figcaption>
                `;
            }
            const list = document.getElementById('agreement-list');
            const count = document.getElementById('agreement-count');

            function updateList() {
                const query = search.value.trim().toLocaleLowerCase('fr');
                const selectedTheme = themeFilter.value;
                const allThemes = !selectedTheme;
                siteFilter.hidden = !allThemes;
                yearFilter.hidden = !allThemes;
                const selectedSite = allThemes ? siteFilter.value : '';
                const availableYears = [...new Set(agreementRows
                    .filter(agreement => agreement.site === siteFilter.value)
                    .map(agreement => agreement.year))]
                    .sort((first, second) => second.localeCompare(first));
                const previousYear = yearFilter.value;
                yearFilter.innerHTML = `<option value="">Toutes les années</option>${availableYears
                    .map(year => `<option value="${escapeHtml(year)}">${escapeHtml(year)}</option>`)
                    .join('')}`;
                yearFilter.value = availableYears.includes(previousYear) ? previousYear : '';
                const selectedYear = allThemes ? yearFilter.value : '';
                renderRepresentativity(selectedSite);
                const filtered = agreementRows.filter(agreement => {
                    const tags = Array.isArray(agreement.tags) ? agreement.tags : [];
                    const matchesSite = !selectedSite || tags.includes(`#${selectedSite.toLocaleLowerCase('fr')}`);
                    const matchesTheme = !selectedTheme || tags.includes(`#${selectedTheme}`);
                    const matchesYear = !selectedYear || tags.includes(`#${selectedYear}`);
                    const searchableValues = [];
                    const visit = value => {
                        if (Array.isArray(value)) value.forEach(visit);
                        else if (value && typeof value === 'object') Object.values(value).forEach(visit);
                        else if (value) searchableValues.push(value);
                    };
                    visit(agreement);
                    const matchesQuery = !query || searchableValues.join(' ')
                        .toLocaleLowerCase('fr').includes(query);
                    return matchesSite && matchesTheme && matchesYear && matchesQuery;
                });

                count.textContent = `${filtered.length} accord${filtered.length === 1 ? '' : 's'}`;
                list.innerHTML = filtered.length ? filtered.map(agreement => {
                    const signatures = getSignatures(agreement);
                    const signatureCount = signatures.length;
                    const isAgreement = agreement.accord === 'accord';
                    const isPending = agreement.accord === 'À vérifier';
                    const validityLabel = isAgreement
                        ? `Accord : ${signatureCount} signatures confirmées`
                        : isPending
                            ? 'À vérifier : signatures non toutes confirmées'
                            : signatureCount
                                ? `Pas d'accord : ${signatureCount} signature${signatureCount > 1 ? 's' : ''} sur le procès-verbal`
                                : "Pas d'accord : procès-verbal, aucune signature d'organisation";
                    const validityClass = isAgreement ? 'valid' : isPending ? 'pending' : 'invalid';
                    const validityText = isAgreement ? 'Accord' : isPending ? 'À vérifier' : "Pas d'accord majoritaire";
                    const signatureSource = agreement.signatureSource || 'Source de signature non renseignée';
                    const validityTitle = `${validityLabel}. Source : ${signatureSource}`;
                    const signatureLabels = {
                        cgt: '<strong>CGT</strong>',
                        cfdt: '<strong>CFDT</strong>',
                        cfe: '<strong>CFE</strong>',
                        cftc: '<strong>CFTC</strong>'
                    };
                    const organizations = {
                        NNF: ['cgt', 'cfdt', 'cfe'],
                        LAN: ['cgt', 'cfdt', 'cfe'],
                        NPS: ['cgt', 'cfdt', 'cfe', 'cftc']
                    }[agreement.site] || ['cgt', 'cfdt', 'cfe'];
                    const organizationStatuses = organizations.map(organization => `
                        <span class="agreement-os-status" data-union="${organization}" title="${escapeHtml(signatureSource)}">${signatureLabels[organization]} <span class="agreement-mark">${signatures.includes(organization) ? '✅' : '❌'}</span></span>
                    `).join('');
                    const agreementStatus = `<div class="agreement-status">${organizationStatuses}</div>`;
                    const documents = getDocuments(agreement);
                    const documentMetaLinks = documents.map(document => {
                        const label = documents.length > 1
                            ? (document.title || getDocumentName(document.url))
                            : (isPending || isAgreement ? "Ouvrir l'accord" : "Ouvrir le PV de désaccord");
                        return `<a class="agreement-link agreement-meta-link" href="${escapeHtml(openInBrowser(document.url))}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
                    });
                    const documentMetaLink = documents.length > 1
                        ? `<ul class="agreement-document-list">${documentMetaLinks.map(link => `<li>${link}</li>`).join('')}</ul>`
                        : documentMetaLinks.join('');
                    const signatureMetaLink = !isAgreement && !isPending ? '' : documents
                        .filter(document => document.signatureTarget)
                        .map(document => `<a class="agreement-link agreement-meta-link" href="${escapeHtml(openInBrowser(document.signatureTarget))}" target="_blank" rel="noopener noreferrer" title="Ouvrir la page de signatures">Voir les signatures ↗</a>`)
                        .join('');
                    const tractLinks = getTracts(agreement).map(tract => {
                        const title = escapeHtml(tract.title || 'Ouvrir le tract');
                        const link = tract.url
                            ? `<a class="agreement-link agreement-tract-link" href="${escapeHtml(openInBrowser(tract.url))}" target="_blank" rel="noopener noreferrer" title="Ouvrir le tract : ${title}">${title} ↗</a>`
                            : title;
                        return `<div class="agreement-tract-line agreement-content">Relire notre tract : ${link}</div>`;
                    }).join('');

                    return `
                        <div class="agreement-entry">
                            <div class="agreement-main">
                                <div class="agreement-heading">
                                    <div class="agreement-title-line">
                                        <span class="agreement-title">${escapeHtml(agreement.title)}</span>
                                        <span class="agreement-validity ${validityClass}" title="${escapeHtml(validityTitle)}" aria-label="${escapeHtml(validityLabel)}">${validityText}</span>
                                    </div>
                                    <div class="agreement-meta-line">
                                        <span class="agreement-meta">${agreement.year} · ${escapeHtml(agreement.site)}</span>
                                        ${documentMetaLink}
                                        ${signatureMetaLink}
                                    </div>
                                    <span class="agreement-content">${escapeHtml(agreement.content || '—')}</span>
                                    ${agreement.cgtPosition ? `<span class="agreement-content agreement-cgt-position"><strong>Position CGT :</strong> ${escapeHtml(agreement.cgtPosition)}</span>` : ''}
                                    ${tractLinks}
                                </div>
                            </div>
                            ${agreementStatus}
                        </div>
                    `;
                }).join('') : '<p class="agreement-empty">Aucun accord ne correspond à la recherche.</p>';
            }

            search.addEventListener('input', updateList);
            siteFilter.addEventListener('change', updateList);
            themeFilter.addEventListener('change', updateList);
            yearFilter.addEventListener('change', updateList);
            updateList();
        }

        renderAgreementList();
    </script>
